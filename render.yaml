# Render Blueprint for the API (persistent Node server + Socket.IO). Secrets are NOT stored here:
# every `sync: false` value is entered in the Render dashboard.
# NOTE: Render's free web services spin down when idle, which would drop live chat connections and make the
# first request slow. Use a paid instance type for a real shop.
services:
  - type: web
    name: bile-cutz-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: node dist/server.js
    healthCheckPath: /health
    envVars:
      - { key: NODE_ENV, value: production }
      - { key: TRUST_PROXY, value: "true" }
      - { key: DATABASE_SSL, value: "true" }
      - { key: DATABASE_URL, sync: false }
      - { key: SESSION_SECRET, sync: false }
      - { key: ALLOWED_ORIGINS, sync: false }
      - { key: FRONTEND_URL, sync: false }
      - { key: PUBLIC_API_URL, sync: false }
      - { key: COOKIE_SAMESITE, value: lax }
      - { key: COOKIE_DOMAIN, sync: false }
      - { key: EMAIL_PROVIDER, value: smtp }
      - { key: EMAIL_FROM, sync: false }
      - { key: SMTP_HOST, sync: false }
      - { key: SMTP_PORT, value: "587" }
      - { key: SMTP_USER, sync: false }
      - { key: SMTP_PASS, sync: false }
      - { key: STORAGE_PROVIDER, value: supabase }
      - { key: SUPABASE_URL, sync: false }
      - { key: SUPABASE_SERVICE_ROLE_KEY, sync: false }
